x-app-environment: &app-environment
  ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-yggdrasil};Username=${POSTGRES_USER:-yggdrasil};Password=${POSTGRES_PASSWORD}"
  Jwt__IssuerSigningKey: ${JWT_SIGNING_KEY:-}
  Cors__AllowedOrigins__0: http://localhost:${APP_PORT:-8080}

services:
  db:
    image: postgres:17-alpine
    container_name: yggdrasil-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yggdrasil}
      POSTGRES_USER: ${POSTGRES_USER:-yggdrasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yggdrasil} -d ${POSTGRES_DB:-yggdrasil}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: yggdrasil-app
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:${APP_PORT:-8080}
    command: ["--seed"]
    environment:
      <<: *app-environment
      Seed__Password: ${SEED_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  
  app:
    image: yggdrasil-app
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:${APP_PORT:-8080}
    environment: *app-environment
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
