services:
  db:
    image: postgres:17-alpine
    container_name: yggdrasil-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yggdrasil}
      POSTGRES_USER: ${POSTGRES_USER:-yggdrasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yggdrasil} -d ${POSTGRES_DB:-yggdrasil}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
