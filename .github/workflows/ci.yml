name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check C# formatting
        run: >
          dotnet format backend/Yggdrasil.sln 
          --verify-no-changes

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: dotnet restore backend/Yggdrasil.sln

      - name: Build
        run: dotnet build backend/Yggdrasil.sln --configuration Release --no-restore

      - name: Test with the dotnet CLI
        run: >
          dotnet test backend/Yggdrasil.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Upload dotnet test results
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-results
          path: TestResults
        if: ${{ always() }}

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  deploy:
    name: Azure deployment
    runs-on: ubuntu-latest

    needs: [format, backend, frontend]
    if: github.ref == 'refs/heads/main' # deploy only after merge to main
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build frontend and API
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          dotnet publish backend/Yggdrasil.Api -c Release -r linux-x64 -o publish
          mkdir -p publish/wwwroot && cp -r frontend/dist/. publish/wwwroot/

        env:
          VITE_API_BASE_URL: https://yggdrasil-experis.azurewebsites.net

      - uses: azure/webapps-deploy@v3
        with:
          app-name: yggdrasil-experis
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Smoke test
        run: curl --fail --retry 10 --retry-delay 15 --retry-all-errors https://yggdrasil-experis.azurewebsites.net/api/categories
