name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check C# formatting
        run: >
          dotnet format backend/Yggdrasil.sln 
          --verify-no-changes 
          --exclude backend/Yggdrasil.Infrastructure/Migrations

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: dotnet restore backend/Yggdrasil.sln

      - name: Build
        run: dotnet build backend/Yggdrasil.sln --configuration Release --no-restore

      - name: Test with the dotnet CLI
        run: >
          dotnet test backend/Yggdrasil.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Upload dotnet test results
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-results
          path: TestResults
        if: ${{ always() }}

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
